[package]
name = "keystone"
version = "1.0.0"
edition = "2024"
description = "Keystone Vault: encrypted secrets and configuration for the Portal SSO suite"

license = "Apache-2.0"

[[bin]]
name = "keystone"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "any", "migrate", "tls-rustls"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tower-http = { version = "0.6", features = ["fs", "trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
subtle = "2"
dotenvy = "0.15"
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.23"
rand = "0.8"
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
ipnet = "2"
argon2 = { version = "0.5", features = ["std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rsa = { version = "0.9", features = ["pem"] }
