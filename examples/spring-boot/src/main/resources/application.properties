# The only configuration committed to source control. Everything else, secrets included, is
# loaded from Keystone Vault before the application context starts.
spring.application.name=orders-service
spring.config.import=configserver:
spring.cloud.config.uri=${KEYSTONE_URL}/config
spring.cloud.config.username=keystone
spring.cloud.config.password=${KEYSTONE_TOKEN}
# Refuse to start without configuration rather than run on defaults.
spring.cloud.config.fail-fast=true
