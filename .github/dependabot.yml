# Weekly upgrade PRs, plus immediate security PRs. Every PR runs the full pipeline, including the
# Spring Boot end-to-end test, so a bump that breaks loading secrets fails before it can merge.
# Majors of the frameworks are planned upgrades, not bump PRs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    groups:
      rust-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Breaking releases (sqlx 0.9, aes-gcm 0.11, jsonwebtoken 11, ...) change APIs or, for the
    # crypto crates, on-disk formats: planned upgrades with code changes, not bump PRs.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "typescript"]
        update-types: [minor, patch]
      console-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "typescript"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Test tooling majors (vitest, jsdom) move with Angular's supported versions.
      - dependency-name: "vitest"
        update-types: [version-update:semver-major]
      - dependency-name: "jsdom"
        update-types: [version-update:semver-major]

  - package-ecosystem: maven
    directory: /examples/spring-boot
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    commit-message: { prefix: "chore(ci)" }
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    commit-message: { prefix: "chore(docker)" }
    ignore:
      - dependency-name: "node"
        update-types: [version-update:semver-major]
